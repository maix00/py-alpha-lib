[package]
name = "nautilus-factor-bridge"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Independent Rust bridge between Nautilus market events and py-alpha-lib factor execution"

[features]
default = []
nautilus = ["dep:nautilus-core", "dep:nautilus-model", "dep:nautilus-common", "dep:ustr"]
nautilus-backtest = ["nautilus", "dep:nautilus-backtest", "nautilus-backtest/streaming", "dep:nautilus-persistence", "dep:nautilus-execution", "dep:nautilus-trading"]

[dependencies]
alpha-algo = { path = "../../alpha-algo" }
rayon = "1"
anyhow = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nautilus-core = { version = "=0.67.0", optional = true }
nautilus-model = { version = "=0.67.0", optional = true }
nautilus-common = { version = "=0.67.0", optional = true }
nautilus-backtest = { version = "=0.67.0", optional = true }
nautilus-persistence = { version = "=0.67.0", optional = true }
nautilus-execution = { version = "=0.67.0", optional = true }
nautilus-trading = { version = "=0.67.0", optional = true }
ustr = { version = "1", optional = true }


[lib]
name = "nautilus_factor_bridge"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "catalog_replay"
required-features = ["nautilus-backtest"]

# Keep the adapter outside the language-bindings workspace. Hosts can patch the
# pinned Nautilus packages to one source checkout without changing alpha core.
[workspace]
